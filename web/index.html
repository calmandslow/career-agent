<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Agent 工作台</title><style>
#career-proto{--paper:light-dark(#fff,#20242b);--bg:light-dark(#f5f7fa,#171b21);--ink:light-dark(#202c3d,#edf1f7);--sub:light-dark(#66758a,#a4b1c4);--line:light-dark(#e1e7ef,#384252);--action:light-dark(#2859bc,#85adff);--wash:light-dark(#eaf0fc,#293e60);color:var(--ink);background:var(--paper);font:14px/1.6 system-ui,sans-serif;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#career-proto *{box-sizing:border-box}#career-proto button,#career-proto input,#career-proto textarea{font:inherit}#career-proto button:focus-visible,#career-proto input:focus-visible,#career-proto textarea:focus-visible{outline:2px solid var(--action);outline-offset:3px}#career-proto .shell{display:grid;grid-template-columns:190px 1fr;min-height:560px}#career-proto aside{background:var(--bg);padding:24px 16px;border-right:1px solid var(--line)}#career-proto .brand{font-size:19px;font-weight:650;margin-bottom:28px}#career-proto .minor{color:var(--sub);font-size:12px}#career-proto button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:7px}#career-proto .primary{background:var(--action);border-color:var(--action);color:light-dark(#fff,#142033)}#career-proto aside button{width:100%;text-align:left;margin:5px 0}#career-proto aside button.selected{background:var(--wash);color:var(--action);border-color:transparent}#career-proto main{padding:28px;min-width:0}#career-proto h1{font-size:27px;line-height:1.3;margin:8px 0 14px}#career-proto h2{font-size:18px;margin:0 0 14px}#career-proto h3{font-size:15px;margin:0 0 8px}#career-proto p{margin:8px 0 18px}#career-proto .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#career-proto .tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:24px 0;flex-wrap:wrap}#career-proto .tabs button{border:0;border-radius:0;background:transparent;padding:10px 0;color:var(--sub)}#career-proto .tabs button.selected{border-bottom:2px solid var(--action);color:var(--action)}#career-proto .panel{border:1px solid var(--line);border-radius:9px;padding:22px;margin:14px 0;background:var(--paper)}#career-proto .columns{display:grid;grid-template-columns:1fr 230px;gap:22px}#career-proto .badge{background:var(--wash);color:var(--action);padding:4px 9px;border-radius:5px;font-size:12px}#career-proto .item{padding:15px 0;border-bottom:1px solid var(--line)}#career-proto .item:last-child{border:0}#career-proto textarea,#career-proto input{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:12px}#career-proto textarea{min-height:145px;resize:vertical}#career-proto label{display:block;margin:16px 0 7px}#career-proto .question{font-size:19px;line-height:1.6;padding:22px 0}#career-proto .hint{border-left:3px solid var(--action);padding:10px 16px;background:var(--bg);margin:14px 0}#career-proto [hidden]{display:none!important}#career-proto .footer{border-top:1px solid var(--line);padding:12px 28px;color:var(--sub);font-size:12px}
@media(max-width:720px){#career-proto .shell{grid-template-columns:1fr}#career-proto aside{border-right:0;border-bottom:1px solid var(--line);padding:15px}#career-proto .brand{margin-bottom:8px}#career-proto aside button{width:auto}#career-proto main{padding:20px}#career-proto .columns{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="/static/app.css"></head><body><div id="career-proto"><div class="shell"><aside><div class="brand">Career Agent</div><div id="mode" class="minor"></div><button data-page="materials">基础材料</button><button class="primary" data-page="new">＋ 新建岗位</button><section class="nav-jobs" aria-label="我的岗位"><p class="minor">我的岗位</p><div id="jobs"></div></section><section class="nav-tools" aria-label="工具"><p class="minor">工具</p><button data-page="tasks">运行记录</button><details id="deleted-jobs"><summary>已删除岗位</summary><div id="deleted-job-list"></div></details><details class="settings"><summary>模型与费用说明</summary><div id="settings"></div></details></section></aside><main><header id="job-header" hidden><div class="minor">我的岗位 / <span id="company-crumb"></span></div><div class="row"><h1 id="role-heading"></h1><span class="badge" id="stage"></span></div><nav class="tabs" aria-label="岗位准备"><button data-tab="overview">岗位分析</button><button data-tab="resume">定制简历</button><button data-tab="prep">面试准备</button><button data-tab="mock">模拟面试</button></nav></header><div id="notice" role="status" hidden></div><div id="progress" aria-live="polite"></div><div id="content"></div></main></div><div class="footer">个人求职工作台 · 文件与记录保存在本机 · 模型处理材料时会通过后端发送给所选服务</div></div><script src="/static/app.js" defer></script></body></html>
